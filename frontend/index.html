<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0c10" />
    <title>wowfix — Addon Repair</title>
    <style>
      html,
      body {
        background: #0a0c10;
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <script>
      // Resolve mock mode before the module graph loads: ?mock=1 in the URL,
      // or window.__WOWFIX_MOCK__ set by an embedding harness.
      window.__WOWFIX_MOCK__ =
        window.__WOWFIX_MOCK__ === true ||
        new URLSearchParams(window.location.search).get("mock") === "1";
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
