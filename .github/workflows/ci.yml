name: CI

on:
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/**'
      - '.gitattributes'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/**'
      - '.gitattributes'

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: ['1.24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: gofmt
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt found unformatted files:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build ./...

  crosscompile:
    name: crosscompile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Cross-compile CLI
        run: |
          mkdir -p dist
          for target in linux/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            out=dist/wowfix-$os-$arch
            if [ "$os" = "windows" ]; then out=$out.exe; fi
            GOOS=$os GOARCH=$arch go build -o "$out" ./cmd/wowfix
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: wowfix-dist
          path: dist/
