name: CI

on:
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/**'
      - '.gitattributes'
      - 'frontend/**'
      - 'wails.json'
      - 'build/**'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/**'
      - '.gitattributes'
      - 'frontend/**'
      - 'wails.json'
      - 'build/**'

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: ['1.25.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The root package embeds frontend/dist (generated by npm run build),
      # so go list ./... fails on a fresh checkout unless the frontend is
      # built first. frontend/package-lock.json is committed, so use npm ci.
      - name: Build frontend
        shell: bash
        run: cd frontend && npm ci && npm run build

      - name: gofmt
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt found unformatted files:"
            echo "$files"
            exit 1
          fi

      # The wails GUI packages (root main, cmd/wowfix-gui, internal/gui)
      # are excluded here: on linux they need GTK/WebKit development
      # headers and are built by the gui-build job (windows-latest).
      - name: Vet
        shell: bash
        run: |
          pkgs=$(go list ./... | grep -v -e '/cmd/wowfix-gui' -e '/internal/gui' -e '^github.com/wowfix/wowfix$')
          go vet $pkgs

      - name: Test
        shell: bash
        run: |
          pkgs=$(go list ./... | grep -v -e '/cmd/wowfix-gui' -e '/internal/gui' -e '^github.com/wowfix/wowfix$')
          go test $pkgs -count=1

      - name: Build (CLI only)
        run: go build ./cmd/wowfix

  crosscompile:
    name: crosscompile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Cross-compile CLI
        run: |
          mkdir -p dist
          for target in linux/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            out=dist/wowfix-$os-$arch
            if [ "$os" = "windows" ]; then out=$out.exe; fi
            GOOS=$os GOARCH=$arch go build -o "$out" ./cmd/wowfix
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: wowfix-dist
          path: dist/

  gui-build:
    name: gui-build (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build GUI
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\go\bin;C:\Program Files (x86)\NSIS;$env:Path"
          wails build -nsis

      - name: Upload GUI binary
        uses: actions/upload-artifact@v4
        with:
          name: wowfix-gui
          path: build/bin/wowfix.exe

      - name: Upload GUI installer
        uses: actions/upload-artifact@v4
        with:
          name: wowfix-gui-installer
          path: build/bin/wowfix-amd64-installer.exe
          if-no-files-found: error
