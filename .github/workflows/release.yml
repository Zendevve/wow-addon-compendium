name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          ldflags="-X main.version=${GITHUB_REF_NAME#v} -X main.commit=$GITHUB_SHA -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for target in linux/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            out=dist/wowfix-$os-$arch
            if [ "$os" = "windows" ]; then out=$out.exe; fi
            GOOS=$os GOARCH=$arch go build -ldflags "$ldflags" -o "$out" ./cmd/wowfix
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
