name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: release (CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          ldflags="-X main.version=${GITHUB_REF_NAME#v} -X main.commit=$GITHUB_SHA -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for target in linux/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            out=dist/wowfix-cli-$os-$arch
            if [ "$os" = "windows" ]; then out=$out.exe; fi
            GOOS=$os GOARCH=$arch go build -ldflags "$ldflags" -o "$out" ./cmd/wowfix
          done

      - name: Publish CLI release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          overwrite_files: true
          generate_release_notes: true

  gui:
    name: gui (windows-latest)
    runs-on: windows-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build GUI
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\go\bin;C:\Program Files (x86)\NSIS;$env:Path"
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          wails build -nsis -ldflags "-X main.version=$ver"

      - name: Publish GUI release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/wowfix.exe
            build/bin/wowfix-amd64-installer.exe
          overwrite_files: true
